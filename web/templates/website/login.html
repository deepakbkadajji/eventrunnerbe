{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Start2Finish</title>
    <link rel="stylesheet" href="{% static 'website/css/app.css' %}">
</head>
<body class="login-page has-page-background" style="--page-background-image: url('{% static page_background_image %}');">

<div class="login-container">

    <div class="logo">
        <h1>Start 2 Finish Portal</h1>
        <p>Sign in to continue</p>
    </div>

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="form-group">
            <label>Username or Email</label>
            <input type="text" name="username" autocomplete="username" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="login-btn">Login</button>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}
    </form>

    <div class="forgot-password">
        <a href="#">Forgot Password?</a>
    </div>

</div>

</body>
</html>
