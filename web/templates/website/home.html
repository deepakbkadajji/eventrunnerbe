{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start2Finish</title>
    <link rel="stylesheet" href="{% static 'website/css/app.css' %}">
</head>
<body class="has-page-background" style="--page-background-image: url('{% static page_background_image %}');">

<nav class="app-navbar">
    <div class="app-logo">Start 2 Finish</div>
    <div class="app-nav-links">
        <a href="{% url 'home' %}" class="app-nav-link active">Home</a>
        <a href="{% url 'login' %}" class="app-nav-link">Login</a>
        <a href="{% url 'about' %}" class="app-nav-link">About</a>
    </div>
</nav>

<main class="page-shell">
    <div class="page-container">
        <div class="card" style="max-width: 720px;">
            <h1 class="page-heading">Welcome</h1>
            <p style="color: var(--muted); margin-bottom: 16px;">
                Start2Finish helps you manage athletic events, organisations, and participants.
            </p>
            <p style="margin-bottom: 20px;">
                <a href="{% url 'login' %}" class="btn btn-primary">Sign in to get started</a>
            </p>
        </div>
    </div>
</main>

</body>
</html>
