{% extends 'website/basepage.html' %}

{% block title %}Participants{% endblock %}

{% block content %}

<div class="page-shell">
    <div class="page-container">
        <div class="content-header">
            <div class="content-header-text">
                <h1>Participants</h1>
                <p>Browse and open participant records.</p>
            </div>
        </div>

        <div class="toolbar">
            <button class="open-btn" onclick="openParticipant()">Open Participant</button>
        </div>

        <table class="participant-table">
            <thead>
                <tr>
                    <th></th>
                    <th>User</th>
                    <th>Title</th>
                    <th>Surname</th>
                    <th>First Name</th>
                    <th>Initials</th>
                    <th>Email Address</th>
                </tr>
            </thead>
            <tbody id="participantTableBody"></tbody>
        </table>
    </div>
</div>

<script>
function openParticipant() {
    const selected = document.querySelector('input[name="participant"]:checked');
    if (!selected) {
        alert('Please select a participant.');
        return;
    }
    window.location.href = '/participants/' + selected.value + '/';
}

document.addEventListener('DOMContentLoaded', loadParticipants);

async function loadParticipants() {
    try {
        const response = await fetch('/api/participants/', { credentials: 'same-origin' });
        const participants = await response.json();
        const tbody = document.getElementById('participantTableBody');
        tbody.innerHTML = '';

        participants.forEach(participant => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><input type="radio" name="participant" value="${participant.id}"></td>
                <td>${participant.user}</td>
                <td>${participant.title}</td>
                <td>${participant.surname}</td>
                <td>${participant.firstname}</td>
                <td>${participant.initials}</td>
                <td>${participant.emailaddress}</td>
            `;
            tbody.appendChild(row);
        });
    } catch (error) {
        console.error('Failed to load participants', error);
    }
}
</script>

{% endblock %}
